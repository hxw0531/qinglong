name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: "develop"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: pnpm/action-setup@v3
        with:
          version: "8.3.1"

      - uses: actions/setup-node@v4
        with:
          cache: "pnpm"

      - name: Configure git for private repos
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' version.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:back

      - name: Build frontend
        run: pnpm build:front

      - name: Install production dependencies
        run: |
          mkdir -p prod_modules
          cp package.json pnpm-lock.yaml prod_modules/
          cd prod_modules
          pnpm install --prod --frozen-lockfile

      - name: Package all files
        run: |
          mkdir -p release/static
          cp -r static/build release/static/
          cp -r static/dist release/static/
          cp -r prod_modules/node_modules release/
          cp package.json release/
          cp .env.example release/.env
          cp -r shell release/
          cp -r sample release/
          cp version.yaml release/
          cd release
          tar -czvf ../qinglong-${{ steps.version.outputs.version }}.tar.gz .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: qinglong-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30
